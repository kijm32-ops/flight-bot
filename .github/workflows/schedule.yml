name: Daily Flight Deal Scraper

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: 코드를 복사해옵니다
      uses: actions/checkout@v4  # 👈 v3에서 v4로 최신화

    - name: 파이썬 파이프라인을 설치합니다
      uses: actions/setup-python@v5  # 👈 v4에서 v5로 최신화
      with:
        python-version: '3.10'

    - name: 크롤링에 필요한 도구(Playwright)를 설치합니다
      run: |
        pip install playwright
        playwright install --with-deps chromium

    - name: 파이썬 스크립트를 실행하고 이메일을 보냅니다
      env:
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      run: python flight_scraper.py
