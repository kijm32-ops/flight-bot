<!--
  ============================================================
  3번 항목 전용 Google Form 임베드 (제목/설명 영역 최소 노출)
  ------------------------------------------------------------
  사용법:
  1. 아래 FORM_URL을 본인 Google Form의 embedded=true URL로 교체
  2. HEADER_CROP_PX 값을 실제 화면 보면서 조정 (보통 90~140px 사이)
     - 너무 작으면 제목이 살짝 보임
     - 너무 크면 첫 번째 질문 상단이 잘림
  3. IFRAME_TOTAL_HEIGHT 도 폼 길이에 맞게 조정
  ============================================================
-->

<style>
  .q3-form-wrap {
    /* 468px(원본) - 120px(크롭) = 348px */
    width: 100%;
    max-width: 640px;
    height: 348px;
    overflow: hidden;
    position: relative;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    margin: 12px 0;
  }

  .q3-form-wrap iframe {
    position: absolute;
    top: -120px;                 /* 제목/설명 영역만큼 위로 밀어올림. 잘리면 -100px, 덜 잘리면 -140px 등으로 조정 */
    left: 0;
    width: 100%;
    height: 468px;                /* Google이 알려준 원본 높이 그대로 사용 */
    border: 0;
  }
</style>

<div class="q3-form-wrap">
  <iframe
    src="https://docs.google.com/forms/d/e/1FAIpQLSehLW8oaE7EFHLS1TQGvVA_pxEBK48kR3OvGzcFrH5JTma_9g/viewform?embedded=true"
    marginheight="0"
    marginwidth="0"
  >로드 중…</iframe>
</div>

<!--
  ============================================================
  값 조정 팁
  ------------------------------------------------------------
  1) 먼저 HEADER_CROP_PX = 0 으로 두고 실제 폼을 브라우저에서 열어보세요.
  2) 제목+설명 영역이 화면에서 몇 px 정도인지 개발자도구(F12)로
     .freebirdFormviewerViewHeaderTitle 요소 높이를 확인하거나,
     그냥 눈대중으로 top 값을 -80px, -100px, -120px 씩 늘려가며
     질문("예/아니오" 객관식)이 잘리지 않는 선에서 최대한 당기세요.
  3) 참고: Google이 Forms 마크업 구조를 바꾸면 크롭 값이 틀어질 수 있습니다.
     완전히 안정적인 "공식 제목 숨김 옵션"은 없다는 점 감안 부탁드립니다.
  ============================================================
-->
